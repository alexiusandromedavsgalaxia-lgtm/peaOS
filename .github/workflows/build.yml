name: build-peaOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-x90:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X90 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ nasm grub-pc-bin grub-common xorriso qemu-system-x86 nodejs
      - name: Validate web certificate service
        working-directory: web-distribution/certificate-service
        run: node self-test.mjs
      - name: Build peaOS 1 Beta 1 X90 ISO
        run: make clean all
      - name: Validate kernel and ISO
        run: |
          test -s build/peaOS-X90.bin
          test -s build/peaOS-X90.iso
          grub-file --is-x86-multiboot build/peaOS-X90.bin
      - name: Boot smoke test and kernel marker validation
        run: |
          set +e
          timeout 8s qemu-system-x86_64 \
            -cdrom build/peaOS-X90.iso \
            -display none \
            -serial file:build/qemu-serial.log \
            -monitor none
          code=$?
          set -e
          test "$code" -eq 124
          grep -F "C++ kernel: online" build/qemu-serial.log
          grep -F "Initial Setup: privileged system service online" build/qemu-serial.log
          grep -F "Activation state: unactivated" build/qemu-serial.log
          grep -F "X90 Morph: ready" build/qemu-serial.log
          grep -F "X90 filesystem snapshots: ready" build/qemu-serial.log
          grep -F "X90 Fusion: ready" build/qemu-serial.log
