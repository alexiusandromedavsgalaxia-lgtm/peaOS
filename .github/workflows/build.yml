name: build-peaOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib nasm grub-pc-bin grub-common xorriso qemu-system-x86
      - name: Build kernel
        run: make
